name: IPA bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    # Das Standard-Token ist bei neuen Repos nur lesend. Ohne das
    # hier scheitert der Release-Schritt mit "Resource not accessible
    # by integration", obwohl die IPA laengst fertig ist.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: |
          # Keine feste Version festnageln: GitHub tauscht die Runner-Images
          # regelmäßig aus, und ein hartes Xcode_16.app lässt den Bau
          # scheitern, sobald dort 16.2 oder 26 liegt.
          NEUSTES=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEUSTES" ]; then
            echo "Nehme $NEUSTES"
            sudo xcode-select -s "$NEUSTES"
          else
            echo "Kein Xcode gefunden, nutze die Voreinstellung"
          fi
          xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -project IVT.xcodeproj \
            -scheme IVT \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: IPA packen
        run: |
          APP="build/Build/Products/Release-iphoneos/IVT.app"
          if [ ! -d "$APP" ]; then
            echo "IVT.app nicht gefunden. Was liegt da:"
            find build/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry IVT.ipa Payload
          rm -rf Payload
          ls -lh IVT.ipa

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: IVT-ipa
          path: IVT.ipa
          if-no-files-found: error

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bau-${{ github.run_number }}
          name: IVT Bau ${{ github.run_number }}
          files: IVT.ipa
          body: |
            Unsignierte IPA für SideStore.
            Gebaut aus Commit ${{ github.sha }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
