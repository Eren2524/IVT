name: IPA bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -project IVT.xcodeproj \
            -scheme IVT \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build | xcpretty || \
          xcodebuild \
            -project IVT.xcodeproj \
            -scheme IVT \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: IPA packen
        run: |
          APP="build/Build/Products/Release-iphoneos/IVT.app"
          test -d "$APP" || { echo "IVT.app nicht gefunden"; ls -R build/Build/Products; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry IVT.ipa Payload
          rm -rf Payload
          ls -lh IVT.ipa

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: IVT-ipa
          path: IVT.ipa
          if-no-files-found: error

      - name: Release anlegen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bau-${{ github.run_number }}
          name: IVT Bau ${{ github.run_number }}
          files: IVT.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
