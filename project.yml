name: IVT
options:
  bundleIdPrefix: de.enriquediaz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"

targets:
  IVT:
    type: application
    platform: iOS
    sources:
      - path: IVT
    info:
      path: IVT/Info.plist
      properties:
        CFBundleDisplayName: IVT
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          IVT erkennt am Standort, wann du die Firma betrittst und wieder
          verlaesst, und startet bzw. beendet damit deine Arbeitszeit.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          IVT braucht den Standort auch im Hintergrund, damit Kommen und Gehen
          auch dann erkannt wird, wenn die App geschlossen ist.
        NSMotionUsageDescription: >-
          IVT zaehlt deine Schritte pro Schicht und erkennt an laengerem
          Stillstand, dass du vermutlich Pause machst.
        NSCameraUsageDescription: >-
          IVT nutzt die Kamera fuer Schadensfotos mit Datum, Uhrzeit und Ort.
        NSPhotoLibraryAddUsageDescription: >-
          IVT speichert gestempelte Schadensfotos in deiner Fotobibliothek,
          wenn du das moechtest.
        NSMicrophoneUsageDescription: >-
          IVT nimmt deine Stimme auf, wenn du diktierst oder eine
          Sprachnotiz machst.
        NSSpeechRecognitionUsageDescription: >-
          IVT wandelt dein Diktat in Text um, standardmaessig nur auf
          dem iPhone.
        BGTaskSchedulerPermittedIdentifiers:
          - de.enriquediaz.ivt.news
        UIBackgroundModes:
          - location
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.enriquediaz.ivt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
